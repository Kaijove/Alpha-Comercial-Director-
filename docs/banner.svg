<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="Commercial Command Center - See the business. Know what matters. Act faster.">
  <title>Commercial Command Center</title>

  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fb2ff"/>
      <stop offset="52%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#b892ff"/>
    </linearGradient>
    <linearGradient id="markFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9dc0ff"/><stop offset="100%" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="markSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b7cf6"/><stop offset="100%" stop-color="#6d5ae0"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="14%" r="66%">
      <stop offset="0%" stop-color="#20458c" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0d1a3a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ec1ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9ec1ff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#9ec1ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arcFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0"/>
      <stop offset="32%" stop-color="#5b8cff" stop-opacity="0.7"/>
      <stop offset="68%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="leftClip"><rect x="64" y="92" width="452" height="300" rx="14"/></clipPath>
    <clipPath id="rightClip"><rect x="1084" y="92" width="452" height="300" rx="14"/></clipPath>

    <style>
      /* Every rule below animates FROM somewhere back TO the element's normal
         state. Nothing starts hidden, so if the renderer never advances the
         animation the banner still reads as finished artwork. */
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
      @keyframes fade { from { opacity: 0; } }
      @keyframes panelIn { from { opacity: 0; transform: translateY(26px) scale(.986); } }
      @keyframes markIn { from { opacity: 0; transform: translateY(12px) scale(.9); } }
      @keyframes draw { from { stroke-dasharray: 640; stroke-dashoffset: 640; }
                        to   { stroke-dasharray: 640; stroke-dashoffset: 0; } }
      @keyframes pass { 0% { transform: translateX(-760px); }
                        58%,100% { transform: translateX(1780px); } }
      @keyframes breathe { 0%,100% { opacity: .38; transform: scale(1); }
                           50% { opacity: 1; transform: scale(1.4); } }
      @keyframes shimmer { 0%,100% { opacity: .32; } 50% { opacity: .74; } }
      @keyframes cardIn { 0% { opacity: 0; transform: translateX(22px); }
                          12%,88% { opacity: 1; transform: translateX(0); }
                          100% { opacity: 1; transform: translateX(0); } }

      .u     { animation: rise .9s cubic-bezier(.16,.84,.44,1) both; }
      .f     { animation: fade 1.1s ease both; }
      .panel { opacity: .94; animation: panelIn 1.1s cubic-bezier(.16,.84,.44,1) both; }
      .mark  { transform-origin: 800px 130px; animation: markIn 1s cubic-bezier(.16,.84,.44,1) .15s both; }
      .draw  { animation: draw 2.3s cubic-bezier(.22,.7,.3,1) 1s both; }
      .sweep { animation: pass 9s cubic-bezier(.45,0,.5,1) 2.6s infinite; }
      .pulse { transform-origin: center; animation: breathe 3.4s ease-in-out 2s infinite; }
      .arc   { opacity: .5; animation: shimmer 6s ease-in-out 1.6s infinite; }
      .signal{ animation: cardIn 9s cubic-bezier(.16,.84,.44,1) 2.2s infinite; }

      .d2{animation-delay:.15s}  .d3{animation-delay:.3s}   .d5{animation-delay:.6s}
      .d6{animation-delay:.75s}  .d7{animation-delay:.9s}   .d8{animation-delay:1.05s}
      .d9{animation-delay:1.2s}  .d10{animation-delay:1.35s} .d11{animation-delay:1.5s}
      .d12{animation-delay:1.65s} .d13{animation-delay:1.8s}

      text { font-family: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .h1   { font-size: 62px; font-weight: 700; letter-spacing: -.022em; }
      .tag  { font-size: 21px; fill: #9aa5b5; }
      .lbl  { font-size: 12.5px; fill: #8894a6; font-weight: 500; }
      .mini { font-size: 10px; fill: #6b7889; letter-spacing: .1em; font-weight: 600; }
      .num  { font-size: 18px; fill: #e4e9f1; font-weight: 600; }
      .sub  { font-size: 9.5px; fill: #78859a; font-weight: 500; }
      .chip { font-size: 12.5px; fill: #9aa8bd; font-weight: 500; }

      @media (prefers-reduced-motion: reduce) {
        .u,.f,.panel,.mark,.draw,.sweep,.pulse,.arc,.signal { animation: none; }
      }
    </style>
  </defs>

  <rect width="1600" height="560" fill="#07080a"/>
  <rect width="1600" height="560" fill="url(#ambient)"/>

  <!-- Left: the executive read -->
  <g class="panel d2">
    <rect x="64" y="92" width="452" height="300" rx="14" fill="#0b0d11" stroke="#1c2029"/>
    <g clip-path="url(#leftClip)">
      <rect x="64" y="92" width="452" height="40" fill="#0e1116"/>
      <circle cx="86" cy="112" r="4" fill="#5b8cff"/>
      <text x="100" y="116" class="mini">EXECUTIVE DASHBOARD</text>

      <g class="f d5">
        <rect x="84" y="152" width="128" height="64" rx="9" fill="#111520" stroke="#1f2634"/>
        <text x="98" y="172" class="mini">REVENUE</text>
        <text x="98" y="197" class="num">2.4M</text>
      </g>
      <g class="f d6">
        <rect x="222" y="152" width="128" height="64" rx="9" fill="#111520" stroke="#1f2634"/>
        <text x="236" y="172" class="mini">FORECAST</text>
        <text x="236" y="197" class="num">3.2M</text>
      </g>
      <g class="f d7">
        <rect x="360" y="152" width="128" height="64" rx="9" fill="#111520" stroke="#1f2634"/>
        <text x="374" y="172" class="mini">WIN RATE</text>
        <text x="374" y="197" class="num">28%</text>
      </g>

      <rect x="84" y="236" width="404" height="136" rx="10" fill="#0e1116" stroke="#1c2029"/>
      <g class="f d9" opacity=".9">
        <path d="M104 336 C 152 328, 178 312, 210 300 C 246 286, 270 294, 304 276 C 342 256, 374 242, 412 230 C 436 222, 452 220, 468 216 L468 366 L104 366 Z" fill="url(#areaFill)"/>
      </g>
      <path d="M104 336 C 152 328, 178 312, 210 300 C 246 286, 270 294, 304 276 C 342 256, 374 242, 412 230 C 436 222, 452 220, 468 216"
            fill="none" stroke="#5b8cff" stroke-width="2.6" stroke-linecap="round" class="draw"/>
      <circle cx="468" cy="216" r="4.5" fill="#7fb2ff" class="f d12"/>
    </g>
  </g>

  <!-- Right: the pipeline -->
  <g class="panel d3">
    <rect x="1084" y="92" width="452" height="300" rx="14" fill="#0b0d11" stroke="#1c2029"/>
    <g clip-path="url(#rightClip)">
      <rect x="1084" y="92" width="452" height="40" fill="#0e1116"/>
      <circle cx="1106" cy="112" r="4" fill="#a78bfa"/>
      <text x="1120" y="116" class="mini">SALES PIPELINE</text>

      <g class="f d6">
        <rect x="1102" y="150" width="82" height="150" rx="9" fill="#0f131a" stroke="#1f2634"/>
        <text x="1114" y="170" class="mini">LEAD</text><text x="1114" y="184" class="sub">14</text>
        <rect x="1114" y="194" width="58" height="24" rx="6" fill="#1a2130"/>
        <rect x="1114" y="224" width="58" height="24" rx="6" fill="#1a2130"/>
      </g>
      <g class="f d7">
        <rect x="1192" y="150" width="82" height="150" rx="9" fill="#0f131a" stroke="#1f2634"/>
        <text x="1204" y="170" class="mini">QUAL</text><text x="1204" y="184" class="sub">10</text>
        <rect x="1204" y="194" width="58" height="24" rx="6" fill="#1a2130"/>
        <rect x="1204" y="224" width="58" height="24" rx="6" fill="#1a2130"/>
      </g>
      <g class="f d8">
        <rect x="1282" y="150" width="82" height="150" rx="9" fill="#0f131a" stroke="#1f2634"/>
        <text x="1294" y="170" class="mini">PROP</text><text x="1294" y="184" class="sub">8</text>
        <rect x="1294" y="194" width="58" height="24" rx="6" fill="#1e2740"/>
        <rect x="1294" y="224" width="58" height="24" rx="6" fill="#1a2130"/>
      </g>
      <g class="f d9">
        <rect x="1372" y="150" width="82" height="150" rx="9" fill="#0f131a" stroke="#1f2634"/>
        <text x="1384" y="170" class="mini">NEG</text><text x="1384" y="184" class="sub">6</text>
        <rect x="1384" y="194" width="58" height="24" rx="6" fill="#232c48"/>
      </g>
      <g class="f d10">
        <rect x="1462" y="150" width="72" height="150" rx="9" fill="#0c1712" stroke="#1e3a2c"/>
        <text x="1474" y="170" class="mini" fill="#4fcf9d">WON</text><text x="1474" y="184" class="sub" fill="#3fbf8f">6</text>
        <rect x="1474" y="194" width="48" height="24" rx="6" fill="#14281f"/>
        <rect x="1474" y="224" width="48" height="24" rx="6" fill="#14281f"/>
      </g>
    </g>

    <!-- One real signal from the intelligence engine, sliding in on the loop -->
    <g class="signal">
      <rect x="1102" y="318" width="432" height="58" rx="10" fill="#12161f" stroke="#2a3346"/>
      <circle cx="1124" cy="340" r="4" fill="#e5675f" class="pulse"/>
      <text x="1140" y="338" class="mini" fill="#e5675f">CRITICAL - ACTIVITY</text>
      <text x="1140" y="359" class="lbl" fill="#dbe1ea">19 opportunities have gone quiet</text>
      <text x="1140" y="372" class="sub">640,500 of open pipeline, no activity for 12+ days</text>
    </g>
  </g>

  <!-- Centre: identity -->
  <g class="mark">
    <path d="M800 88 L847 115 L847 169 L800 196 L753 169 L753 115 Z" fill="url(#markSide)"/>
    <path d="M800 88 L847 115 L800 142 L753 115 Z" fill="url(#markFace)"/>
    <path d="M800 142 L800 196 L753 169 L753 115 Z" fill="#4a72d8" opacity=".8"/>
    <path d="M778 128 L778 157 L800 169 L800 142 Z" fill="#07080a" opacity=".5"/>
  </g>

  <text x="800" y="272" text-anchor="middle" class="h1 u d5" fill="#f2f5f9">Commercial</text>
  <text x="800" y="342" text-anchor="middle" class="h1 u d7" fill="url(#wordmark)">Command Center</text>
  <text x="800" y="392" text-anchor="middle" class="tag u d9">See the business. Know what matters. Act faster.</text>

  <path d="M40 452 C 420 418, 1180 418, 1560 452" fill="none" stroke="url(#arcFade)" stroke-width="1.4" class="arc"/>
  <ellipse cx="800" cy="436" rx="156" ry="26" fill="url(#floorGlow)" opacity=".45" class="f d10"/>

  <!-- Modules -->
  <g class="f d11">
    <text x="386" y="500" text-anchor="middle" class="lbl">Dashboard</text>
    <text x="524" y="500" text-anchor="middle" class="lbl">Analytics</text>
    <text x="655" y="500" text-anchor="middle" class="lbl">Pipeline</text>
    <text x="770" y="500" text-anchor="middle" class="lbl">Team</text>
    <text x="892" y="500" text-anchor="middle" class="lbl">Intelligence</text>
    <text x="1018" y="500" text-anchor="middle" class="lbl">Forecast</text>
    <text x="1136" y="500" text-anchor="middle" class="lbl">Reports</text>
    <circle cx="386" cy="477" r="2.5" fill="#5b8cff"/>
    <circle cx="524" cy="477" r="2.5" fill="#5b8cff"/>
    <circle cx="655" cy="477" r="2.5" fill="#5b8cff"/>
    <circle cx="770" cy="477" r="2.5" fill="#7d8ff5"/>
    <circle cx="892" cy="477" r="2.5" fill="#a78bfa"/>
    <circle cx="1018" cy="477" r="2.5" fill="#a78bfa"/>
    <circle cx="1136" cy="477" r="2.5" fill="#a78bfa"/>
  </g>

  <g class="u d13">
    <rect x="588" y="518" width="424" height="30" rx="15" fill="#0d1016" stroke="#1f2634"/>
    <text x="800" y="538" text-anchor="middle" class="chip">
      Data &#8594; Metrics &#8594; Intelligence &#8594; Forecast &#8594; Action
    </text>
  </g>

  <g class="sweep">
    <rect x="0" y="0" width="280" height="560" fill="url(#sweep)" transform="skewX(-14)"/>
  </g>
</svg>
