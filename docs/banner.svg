<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="Commercial Command Center — See the business. Know what matters. Act faster.">
  <title>Commercial Command Center</title>

  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fb2ff"/>
      <stop offset="55%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="markFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8db4ff"/>
      <stop offset="100%" stop-color="#5b8cff"/>
    </linearGradient>

    <linearGradient id="markSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b6df0"/>
      <stop offset="100%" stop-color="#6d5ae0"/>
    </linearGradient>

    <radialGradient id="ambient" cx="50%" cy="16%" r="62%">
      <stop offset="0%" stop-color="#1b3a7a" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#0d1a3a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#9ec1ff" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#9ec1ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="arcFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#5b8cff" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="leftClip"><rect x="64" y="96" width="452" height="300" rx="14"/></clipPath>
    <clipPath id="rightClip"><rect x="1084" y="96" width="452" height="300" rx="14"/></clipPath>

    <style>
      /* Minimal, restrained motion: one staggered entrance, then two slow loops.
         Nothing bounces, nothing spins, nothing repeats fast enough to distract. */
      .u { opacity: 0; animation: rise .9s cubic-bezier(.16,.84,.44,1) forwards; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .f { opacity: 0; animation: fade 1.1s ease forwards; }
      @keyframes fade { to { opacity: 1; } }

      .panel { opacity: 0; animation: panelIn 1.1s cubic-bezier(.16,.84,.44,1) forwards; }
      @keyframes panelIn {
        from { opacity: 0; transform: translateY(26px) scale(.985); }
        to   { opacity: .92; transform: translateY(0) scale(1); }
      }

      .mark { opacity: 0; transform-origin: 800px 132px;
              animation: markIn 1s cubic-bezier(.16,.84,.44,1) .15s forwards; }
      @keyframes markIn {
        from { opacity: 0; transform: translateY(10px) scale(.9); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* The sparkline draws itself once, then stays. */
      .draw { stroke-dasharray: 620; stroke-dashoffset: 620;
              animation: draw 2.2s cubic-bezier(.22,.7,.3,1) 1s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      /* Bars grow from their baseline. */
      .bar { transform: scaleY(0); transform-origin: bottom;
             animation: grow .8s cubic-bezier(.16,.84,.44,1) forwards; }
      @keyframes grow { to { transform: scaleY(1); } }

      .track { transform: scaleX(0); transform-origin: left;
               animation: fill 1s cubic-bezier(.16,.84,.44,1) forwards; }
      @keyframes fill { to { transform: scaleX(1); } }

      /* Continuous, slow: a light passes across the composition every 9s. */
      .sweep { animation: pass 9s cubic-bezier(.5,0,.5,1) 2.4s infinite; }
      @keyframes pass {
        0%   { transform: translateX(-820px); }
        55%  { transform: translateX(1720px); }
        100% { transform: translateX(1720px); }
      }

      /* The one live signal, breathing rather than blinking. */
      .pulse { animation: breathe 3.4s ease-in-out 2s infinite; transform-origin: center; }
      @keyframes breathe {
        0%, 100% { opacity: .35; transform: scale(1); }
        50%      { opacity: 1;   transform: scale(1.35); }
      }

      .glowline { animation: shimmer 6s ease-in-out 1.6s infinite; }
      @keyframes shimmer { 0%,100% { opacity: .30; } 50% { opacity: .72; } }

      .d1 { animation-delay: .05s } .d2 { animation-delay: .15s }
      .d3 { animation-delay: .30s } .d4 { animation-delay: .45s }
      .d5 { animation-delay: .60s } .d6 { animation-delay: .75s }
      .d7 { animation-delay: .90s } .d8 { animation-delay: 1.05s }
      .d9 { animation-delay: 1.2s } .d10 { animation-delay: 1.35s }
      .d11 { animation-delay: 1.5s } .d12 { animation-delay: 1.65s }
      .d13 { animation-delay: 1.8s } .d14 { animation-delay: 1.95s }

      text { font-family: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .eyebrow { font-size: 13px; letter-spacing: .30em; fill: #6f7b8c; font-weight: 600; }
      .h1 { font-size: 62px; font-weight: 700; letter-spacing: -.022em; }
      .tag { font-size: 21px; fill: #98a3b3; font-weight: 400; }
      .lbl { font-size: 12.5px; fill: #7d8899; font-weight: 500; }
      .mini { font-size: 10px; fill: #5f6b7c; letter-spacing: .09em; font-weight: 600; }
      .num { font-size: 17px; fill: #dfe4ec; font-weight: 600; }
      .chip { font-size: 12.5px; fill: #93a2b8; font-weight: 500; }

      /* Respect a reader who has asked the system for less movement. */
      @media (prefers-reduced-motion: reduce) {
        .u, .f, .panel, .mark, .draw, .bar, .track, .sweep, .pulse, .glowline {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
          stroke-dashoffset: 0 !important;
        }
      }
    </style>
  </defs>

  <rect width="1600" height="560" fill="#07080a"/>
  <rect width="1600" height="560" fill="url(#ambient)"/>

  <!-- ── Left: the executive read ─────────────────────────────────────── -->
  <g class="panel d2">
    <rect x="64" y="96" width="452" height="300" rx="14" fill="#0b0d11" stroke="#1c2029"/>
    <g clip-path="url(#leftClip)">
      <rect x="64" y="96" width="452" height="40" fill="#0e1116"/>
      <circle cx="86" cy="116" r="4" fill="#5b8cff"/>
      <text x="100" y="120" class="mini">EXECUTIVE DASHBOARD</text>

      <g class="f d5">
        <rect x="84" y="156" width="128" height="62" rx="9" fill="#101318" stroke="#1c2029"/>
        <text x="98" y="176" class="mini">REVENUE</text>
        <text x="98" y="200" class="num">2.4M</text>
      </g>
      <g class="f d6">
        <rect x="222" y="156" width="128" height="62" rx="9" fill="#101318" stroke="#1c2029"/>
        <text x="236" y="176" class="mini">FORECAST</text>
        <text x="236" y="200" class="num">3.2M</text>
      </g>
      <g class="f d7">
        <rect x="360" y="156" width="128" height="62" rx="9" fill="#101318" stroke="#1c2029"/>
        <text x="374" y="176" class="mini">WIN RATE</text>
        <text x="374" y="200" class="num">28%</text>
      </g>

      <rect x="84" y="238" width="404" height="134" rx="10" fill="#0e1116" stroke="#1c2029"/>
      <path d="M104 348 L104 352 L468 352 L468 348 Z" fill="none"/>
      <path d="M104 340 C 150 332, 176 318, 208 306 C 244 292, 268 300, 302 282 C 340 262, 372 248, 410 236 C 434 228, 452 226, 468 222"
            fill="none" stroke="#5b8cff" stroke-width="2.5" stroke-linecap="round" class="draw"/>
      <path d="M104 340 C 150 332, 176 318, 208 306 C 244 292, 268 300, 302 282 C 340 262, 372 248, 410 236 C 434 228, 452 226, 468 222 L468 358 L104 358 Z"
            fill="url(#areaFill)" class="f d10"/>
      <circle cx="468" cy="222" r="4" fill="#5b8cff" class="f d12"/>
    </g>
  </g>

  <!-- ── Right: the pipeline ──────────────────────────────────────────── -->
  <g class="panel d3">
    <rect x="1084" y="96" width="452" height="300" rx="14" fill="#0b0d11" stroke="#1c2029"/>
    <g clip-path="url(#rightClip)">
      <rect x="1084" y="96" width="452" height="40" fill="#0e1116"/>
      <circle cx="1106" cy="116" r="4" fill="#a78bfa"/>
      <text x="1120" y="120" class="mini">SALES PIPELINE</text>

      <g class="f d6">
        <rect x="1104" y="156" width="78" height="216" rx="9" fill="#0e1116" stroke="#1c2029"/>
        <text x="1116" y="176" class="mini">LEAD</text>
        <rect x="1116" y="188" width="54" height="26" rx="6" fill="#151922"/>
        <rect x="1116" y="220" width="54" height="26" rx="6" fill="#151922"/>
        <rect x="1116" y="252" width="54" height="26" rx="6" fill="#151922"/>
      </g>
      <g class="f d7">
        <rect x="1192" y="156" width="78" height="216" rx="9" fill="#0e1116" stroke="#1c2029"/>
        <text x="1204" y="176" class="mini">QUAL</text>
        <rect x="1204" y="188" width="54" height="26" rx="6" fill="#151922"/>
        <rect x="1204" y="220" width="54" height="26" rx="6" fill="#151922"/>
      </g>
      <g class="f d8">
        <rect x="1280" y="156" width="78" height="216" rx="9" fill="#0e1116" stroke="#1c2029"/>
        <text x="1292" y="176" class="mini">PROP</text>
        <rect x="1292" y="188" width="54" height="26" rx="6" fill="#151922"/>
        <rect x="1292" y="220" width="54" height="26" rx="6" fill="#1a1f2a"/>
      </g>
      <g class="f d9">
        <rect x="1368" y="156" width="78" height="216" rx="9" fill="#0e1116" stroke="#1c2029"/>
        <text x="1380" y="176" class="mini">NEG</text>
        <rect x="1380" y="188" width="54" height="26" rx="6" fill="#151922"/>
      </g>
      <g class="f d10">
        <rect x="1456" y="156" width="78" height="216" rx="9" fill="#0d1512" stroke="#1c3329"/>
        <text x="1468" y="176" class="mini" fill="#3fbf8f">WON</text>
        <rect x="1468" y="188" width="54" height="26" rx="6" fill="#12211a"/>
        <rect x="1468" y="220" width="54" height="26" rx="6" fill="#12211a"/>
      </g>

      <!-- the one live signal -->
      <circle cx="1516" cy="130" r="5" fill="#3fbf8f" class="pulse"/>
    </g>
  </g>

  <!-- ── Centre: identity ─────────────────────────────────────────────── -->
  <g class="mark">
    <path d="M800 92 L846 118 L846 170 L800 196 L754 170 L754 118 Z" fill="url(#markSide)"/>
    <path d="M800 92 L846 118 L800 144 L754 118 Z" fill="url(#markFace)"/>
    <path d="M800 144 L800 196 L754 170 L754 118 Z" fill="#4a72d8" opacity=".85"/>
    <path d="M779 130 L779 158 L800 170 L800 144 Z" fill="#07080a" opacity=".55"/>
  </g>

  <text x="800" y="272" text-anchor="middle" class="h1 u d5" fill="#f2f5f9">Commercial</text>
  <text x="800" y="342" text-anchor="middle" class="h1 u d7" fill="url(#wordmark)">Command Center</text>

  <text x="800" y="392" text-anchor="middle" class="tag u d9">See the business. Know what matters. Act faster.</text>

  <!-- horizon -->
  <path d="M40 452 C 420 418, 1180 418, 1560 452" fill="none" stroke="url(#arcFade)" stroke-width="1.4" class="glowline"/>
  <ellipse cx="800" cy="434" rx="150" ry="26" fill="url(#floorGlow)" class="f d10" opacity=".5"/>

  <!-- ── Modules ──────────────────────────────────────────────────────── -->
  <g class="f d11">
    <text x="386" y="500" text-anchor="middle" class="lbl">Dashboard</text>
    <text x="524" y="500" text-anchor="middle" class="lbl">Analytics</text>
    <text x="655" y="500" text-anchor="middle" class="lbl">Pipeline</text>
    <text x="770" y="500" text-anchor="middle" class="lbl">Team</text>
    <text x="892" y="500" text-anchor="middle" class="lbl">Intelligence</text>
    <text x="1018" y="500" text-anchor="middle" class="lbl">Forecast</text>
    <text x="1136" y="500" text-anchor="middle" class="lbl">Reports</text>
  </g>
  <g class="f d12" opacity=".9">
    <circle cx="386" cy="476" r="2" fill="#5b8cff"/>
    <circle cx="524" cy="476" r="2" fill="#5b8cff"/>
    <circle cx="655" cy="476" r="2" fill="#5b8cff"/>
    <circle cx="770" cy="476" r="2" fill="#5b8cff"/>
    <circle cx="892" cy="476" r="2" fill="#a78bfa"/>
    <circle cx="1018" cy="476" r="2" fill="#a78bfa"/>
    <circle cx="1136" cy="476" r="2" fill="#a78bfa"/>
  </g>

  <!-- ── The chain, stated once ───────────────────────────────────────── -->
  <g class="u d13">
    <rect x="596" y="518" width="408" height="30" rx="15" fill="#0d1016" stroke="#1c2029"/>
    <text x="800" y="538" text-anchor="middle" class="chip">
      Data &#8594; Metrics &#8594; Intelligence &#8594; Forecast &#8594; Action
    </text>
  </g>

  <!-- ── Slow light pass over the whole composition ───────────────────── -->
  <g class="sweep">
    <rect x="0" y="0" width="300" height="560" fill="url(#sweep)" transform="skewX(-14)"/>
  </g>
</svg>
